<aside class="sidebar">
  <section class="sidebar-brand">
    <div class="logo-frame">
      <img class="logo" src="assets/images/logo-agrocampo.png" alt="Logo de AgroCampo" />
    </div>
    <h2>Menú</h2>
  </section>

  <nav class="menu" aria-label="Menú principal">
    @for (item of menuVisible; track item.ruta) {
      <a [routerLink]="item.ruta" routerLinkActive="active">
        <span class="icon" aria-hidden="true">{{ item.icono }}</span>
        <span>{{ item.nombre }}</span>
      </a>
    }
  </nav>

  <section class="sidebar-footer">
    <small>AgroCampo</small>
    <small>Versión 1.0.0</small>
  </section>
</aside>
