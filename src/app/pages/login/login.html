<main class="login-page">
  <section class="login-shell" aria-labelledby="login-title">
    <header class="login-header">
 <div class="logo-frame">
  <img
    class="login-logo"
    src="/assets/images/logo-agrocampo.png"
    alt="Logo de AgroCampo"
  />
</div>
      <h1>AgroCampo</h1>
    </header>

    <section class="form-card">
      <nav class="tabs" aria-label="Acceso a la cuenta">
        <button class="btn-Inicia-Sesion active" (click)="inicioSesion()">
          Inicia Sesión
        </button>
        <button class="btn-crear-cuenta" (click)="register()">
          Registrarse
        </button>
      </nav>

      <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" novalidate>
        <div class="form-group">
          <label for="correo">Correo personal</label>

          <input
            id="correo"
            type="email"
            formControlName="correo"
            placeholder="Ingrese su correo"
            autocomplete="email"
            [class.input-error]="campoInvalido('correo')"
          />

          @if (campoInvalido('correo')) {
            <small class="error-message">
              Ingresa un correo electrónico válido.
            </small>
          }
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="contrasena">Contraseña</label>

            <a class="forgot-password" href="#recuperar">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <div class="password-field">
            <input
              id="contrasena"
              [type]="mostrarContrasena ? 'text' : 'password'"
              formControlName="contrasena"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
              [class.input-error]="campoInvalido('contrasena')"
            />

            <button
              class="password-button"
              type="button"
              (click)="mostrarContrasena = !mostrarContrasena"
              [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              👁
            </button>
          </div>

          @if (campoInvalido('contrasena')) {
            <small class="error-message">
              La contraseña debe tener mínimo 6 caracteres.
            </small>
          }
        </div>

        <label class="remember-option">
          <input type="checkbox" formControlName="recordarme" />
          <span>Recordarme</span>
        </label>

        <button class="submit-button" type="submit">
          Iniciar sesión
        </button>
      </form>
    </section>
  </section>

  <footer>
    2026 - SISTEMA DE GESTIÓN DE INFORMACIÓN AGROPECUARIA Y VETERINARIA AGROCAMPO
  </footer>
</main>
