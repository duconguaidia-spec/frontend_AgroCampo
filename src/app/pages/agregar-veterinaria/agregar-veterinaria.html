<div class="vet-detail-page">
  <app-site-header />
  <main>
    <section class="detail-hero">
      <div class="shell">
        <a class="back-link" routerLink="/veterinarias">← Volver a veterinarias</a>
        <div class="header-inputs">
            <h1>Nombre de veterinaria: </h1>
            <input type="text" class="main-input" />
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" />
            <button class="btn-buscar">Buscar</button>
        </div>
      </div>
    </section>
    
    <section class="shell detail-content">
      <div class="info-grid">
        <article>
          <i>📍</i>
          <div class="card-content">
            <h2>Ubicación:</h2>
            <input type="text" placeholder="Escribe la ubicacion" class="card-input" />
            <button class="btn-outline">ABRIR EN GOOGLE MAPS</button>
          </div>
        </article>
        <article>
          <i>🕘</i>
          <div class="card-content">
            <h2>Horarios:</h2>
            <input type="text" placeholder="Escribe los horarios de atencion" class="card-input" />
          </div>
        </article>
        <article>
          <i>☎</i>
          <div class="card-content">
            <h2>Teléfono:</h2>
            <input type="text" placeholder="Escribe el numero de telefono" class="card-input" />
          </div>
        </article>
      </div>
      
      <div class="text-fields">
          <div class="field-row">
              <label>Descripcion:</label>
              <input type="text" placeholder="Escribe Una descripcion de tu veterinaria" />
          </div>
          <div class="field-row">
              <label>Especialidad:</label>
              <input type="text" placeholder="Escribe la especialidad de la veterinaria" />
          </div>
      </div>

      <section class="products">
        <h2>Nuestros Productos<br />Y Servicios</h2>
        <div class="products-grid">
          <!-- Mocking the products seen in the image -->
          <article class="product-card">
            <div class="product-image">
                <img src="/assets/bravecto.png" alt="Bravecto" onerror="this.style.display='none'"/>
            </div>
            <div class="product-info">
              <h3>Bravecto</h3>
            </div>
          </article> 
          
          <article class="product-card">
            <div class="product-image">
               <img src="/assets/nexgard.png" alt="NexGard" onerror="this.style.display='none'"/>
            </div>
            <div class="product-info">
              <h3>NexGard y NexGard Spectra</h3>
            </div>
          </article>

          <article class="product-card new-product-btn">
             <div class="add-new">
                 <span>Nuevo producto</span>
                 <span class="plus">+</span>
             </div>
          </article>

          <article class="product-card product-form">
              <div class="product-image-placeholder">
                  <span>Imagen del producto</span>
              </div>
              <div class="product-form-fields">
                  <div class="form-group">
                      <label>Titulo del producto:</label>
                      <input type="text" />
                  </div>
                  <div class="form-group">
                      <label>Descripción:</label>
                      <input type="text" />
                  </div>
              </div>
          </article>
        </div>
      </section>

      <div class="actions">
          <button class="btn-siguiente">Siguiente</button>
      </div>

    </section>
  </main>
  <app-site-footer />
</div>
