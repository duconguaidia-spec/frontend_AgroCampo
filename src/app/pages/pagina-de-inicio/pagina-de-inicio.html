<section class="hero">
  <div class="hero-imagen">
    <img src="assets/images/campo-atardecer.jpg" alt="Agricultor observando su cultivo al atardecer" />
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-contenido">
    <h1 class="hero-titulo">
      Soluciones agrícolas para<br />
      un campo productivo<br />
      y sostenible.
    </h1>

    <p class="hero-subtitulo">
      Asesoría técnica, manejo de cultivos y tecnologías agrícolas para mejorar la producción rural
    </p>

    <div class="hero-botones">
      <button class="btn-crear-cuenta" (click)="crearCuenta()">
        Crear Cuenta
      </button>
      <button class="btn-mas-info" (click)="irMasInformacion()">
        Mas información
      </button>
    </div>
  </div>
</section>
