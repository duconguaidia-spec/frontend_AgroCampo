<div class="recovery-container">
  <div class="recovery-card">
    <a class="back-arrow" routerLink="/login" aria-label="Volver al inicio de sesión">‹</a>
    <header class="login-header"><div class="logo-frame"><img class="login-logo" src="assets/images/logo_agrocampo.png" alt="AgroCampo" /></div></header>
    <h2>Restablecer contraseña</h2>
    @if (mensajeExito()) {
      <p class="success-text" role="status">{{ mensajeExito() }}</p>
      <a routerLink="/login">Iniciar sesión</a>
    } @else if (token) {
      <form [formGroup]="formularioReset" (ngSubmit)="onSubmitPassword()">
        <div class="form-group"><label for="nuevaContrasena">Nueva contraseña</label><input id="nuevaContrasena" type="password" autocomplete="new-password" formControlName="nuevaContrasena" /></div>
        <div class="form-group"><label for="confirmarContrasena">Confirmar contraseña</label><input id="confirmarContrasena" type="password" autocomplete="new-password" formControlName="confirmarContrasena" /></div>
        @if (mensajeError()) { <p class="error-text" role="alert">{{ mensajeError() }}</p> }
        <button type="submit" [disabled]="cargando()">{{ cargando() ? 'Guardando…' : 'Guardar contraseña' }}</button>
      </form>
    } @else { <p role="alert">Enlace inválido.</p> }
  </div>
</div>
